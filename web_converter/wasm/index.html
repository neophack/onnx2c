<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onnx2c WASM Converter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            line-height: 1.6;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #38bdf8;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid #334155;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #cbd5e1;
        }
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 0.95rem;
        }
        input[type="checkbox"] {
            margin-right: 8px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .upload-zone {
            border: 2px dashed #475569;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.05);
        }
        #fileInput { display: none; }
        .btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: filter 0.2s;
        }
        .btn:hover:not(:disabled) { filter: brightness(1.1); }
        .btn:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        .status {
            padding: 12px 16px;
            border-radius: 8px;
            margin: 16px 0;
            display: none;
        }
        .status.info { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; }
        .status.error { background: rgba(248, 113, 113, 0.15); color: #fca5a5; }
        .status.success { background: rgba(74, 222, 128, 0.15); color: #86efac; }
        pre {
            background: #0f172a;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            max-height: 400px;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .file-name {
            color: #38bdf8;
            font-weight: 600;
        }
        .hint {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>onnx2c WASM Converter</h1>
        <p class="subtitle">Convert ONNX models to C code entirely in your browser. No backend required.</p>

        <div class="card">
            <div class="upload-zone" id="uploadZone">
                <p>Drop an ONNX file here or click to browse</p>
                <input type="file" id="fileInput" accept=".onnx">
                <p class="file-name" id="fileName"></p>
            </div>
        </div>

        <div class="card">
            <h3 style="margin-bottom: 16px; color: #38bdf8;">Options</h3>
            <div class="form-row">
                <div class="form-group">
                    <label for="funcName">Entry function name</label>
                    <input type="text" id="funcName" value="entry">
                </div>
                <div class="form-group">
                    <label for="precision">Output precision</label>
                    <input type="number" id="precision" value="20" min="1" max="50">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="noGlobals"> No globals
                    </label>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="onlyInit"> Only initialization
                    </label>
                </div>
            </div>
            <div class="form-group">
                <label for="optimizations">Optimizations</label>
                <select id="optimizations">
                    <option value="">Default (unionize, fold_casts)</option>
                    <option value="none">none</option>
                    <option value="unionize">unionize</option>
                    <option value="fold_casts">fold_casts</option>
                    <option value="unionize,fold_casts">unionize,fold_casts</option>
                </select>
            </div>
            <button class="btn" id="convertBtn" disabled>Convert</button>
            <div id="status" class="status"></div>
        </div>

        <div class="card" id="resultCard" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="color: #38bdf8;">Generated C Code</h3>
                <button class="btn" id="downloadBtn">Download .c</button>
            </div>
            <pre id="codeOutput"></pre>
        </div>
    </div>

    <script src="onnx2c.js"></script>
    <script src="app.js"></script>
</body>
</html>
